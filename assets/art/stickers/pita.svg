    <circle cx="70" cy="70" r="64"/>
  </g>
  <circle cx="70" cy="70" r="55" fill="#FFC23C"/>
  <circle cx="70" cy="70" r="55" fill="none" stroke="#C78F1E" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M30 52 Q44 30 70 26" fill="none" stroke="#FFF1B8" stroke-width="6" stroke-linecap="round"/>
  <!-- The pita, full -->
  <g transform="translate(22 58)">
    <ellipse cx="48" cy="14" rx="38" ry="9" fill="#EFCF98" stroke="#B98A4E" stroke-width="3.5"/>
    <g stroke-linejoin="round">
      <path d="M14 14 Q18 2 30 6 Q36 -4 46 2 Q56 -6 66 2 Q76 -2 82 14Z" fill="#7FBF5B" stroke="#4F8A33" stroke-width="3"/>
      <g fill="#B07A35" stroke="#6B4520" stroke-width="3">
