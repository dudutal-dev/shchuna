        <circle cx="52" cy="-6" r="10.5"/>
        <circle cx="69" cy="2" r="9.5"/>
      </g>
      <g fill="#E04A3A" stroke="#A93225" stroke-width="2.5"><rect x="20" y="4" width="10" height="10" rx="2.5"/><rect x="42" y="4" width="9" height="9" rx="2.5"/></g>
    </g>
    <path d="M10 14 Q10 50 48 50 Q86 50 86 14 Q70 24 48 24 Q26 24 10 14Z" fill="#EFCF98" stroke="#B98A4E" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M20 26 Q30 30 40 31" fill="none" stroke="#FBE6C2" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- A heart: made for someone -->
  <path d="M98 34 Q98 24 106 24 Q112 24 112 31 Q112 24 118 24 Q126 24 126 34 Q126 44 112 54 Q98 44 98 34Z" fill="#E5508A" stroke="#B73A6B" stroke-width="3" stroke-linejoin="round"/>
