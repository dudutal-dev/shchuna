    <circle cx="170" cy="262" r="34" fill="#4A4F57" stroke="#2E3238" stroke-width="4"/>
    <circle cx="440" cy="262" r="34" fill="#4A4F57" stroke="#2E3238" stroke-width="4"/>
    <circle cx="170" cy="262" r="16" fill="#DDE3E8" stroke="#8A8F96" stroke-width="3"/>
    <circle cx="440" cy="262" r="16" fill="#DDE3E8" stroke="#8A8F96" stroke-width="3"/>
    <circle cx="170" cy="262" r="5" fill="#3AA99F" stroke="#23766F" stroke-width="2.5"/>
    <circle cx="440" cy="262" r="5" fill="#3AA99F" stroke="#23766F" stroke-width="2.5"/>
    <path d="M150 248 Q158 238 170 236 M420 248 Q428 238 440 236" fill="none" stroke="#6B717A" stroke-width="3"/>
