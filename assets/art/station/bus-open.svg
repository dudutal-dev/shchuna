      <rect x="68" y="242" width="48" height="20" rx="4" fill="#9AA5AD" stroke="#6F7A82" stroke-width="3"/>
      <path d="M92 70 V240" stroke="#C78F1E" stroke-width="8"/>
      <path d="M92 70 V240" stroke="#FFC23C" stroke-width="4"/>
      <g fill="#A9D7F2" stroke="#23766F" stroke-width="3"><rect x="68" y="56" width="11" height="206" rx="5"/><rect x="105" y="56" width="11" height="206" rx="5"/></g>
      <rect x="290" y="54" width="60" height="210" rx="8" fill="#DCEFEA" stroke="#23766F" stroke-width="3.5"/>
      <rect x="292" y="242" width="56" height="20" rx="4" fill="#9AA5AD" stroke="#6F7A82" stroke-width="3"/>
      <path d="M320 70 V240" stroke="#C78F1E" stroke-width="8"/>
      <path d="M320 70 V240" stroke="#FFC23C" stroke-width="4"/>
      <g fill="#A9D7F2" stroke="#23766F" stroke-width="3"><rect x="292" y="56" width="11" height="206" rx="5"/><rect x="337" y="56" width="11" height="206" rx="5"/></g>
    </g>
    <!-- Mirror -->
    <path d="M18 72 Q6 74 7 84" fill="none" stroke="#23766F" stroke-width="4"/>
    <ellipse cx="7" cy="94" rx="5" ry="11" fill="#3AA99F" stroke="#23766F" stroke-width="3.5"/>
