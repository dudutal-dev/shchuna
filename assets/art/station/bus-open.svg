    <ellipse cx="20" cy="216" rx="7" ry="10" fill="#FFF7E0" stroke="#C9B48A" stroke-width="3"/>
    <rect x="6" y="238" width="34" height="18" rx="9" fill="#C7CDD2" stroke="#8A8F96" stroke-width="3.5"/>
    <rect x="502" y="238" width="34" height="18" rx="9" fill="#C7CDD2" stroke="#8A8F96" stroke-width="3.5"/>
    <rect x="518" y="198" width="12" height="24" rx="6" fill="#E5508A" stroke="#B8396A" stroke-width="3"/>
