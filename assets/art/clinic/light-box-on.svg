<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160">
  <!-- Frame -->
  <rect x="4" y="4" width="192" height="146" rx="18" fill="#FAFBF8" stroke="#B9C6CC" stroke-width="4"/>
  <!-- Glowing screen -->
  <rect x="18" y="18" width="164" height="104" rx="10" fill="#DDF3FF" stroke="#8FBBD6" stroke-width="3.5"/>
  <!-- X-ray film -->
  <rect x="50" y="22" width="100" height="96" rx="8" fill="#3F6E8C"/>
  <!-- Friendly hand: rounded white bones -->
  <g fill="#F4FBFF" stroke="#BFE6FF" stroke-width="2">
    <!-- palm bones -->
    <rect x="76" y="70" width="9" height="24" rx="4.5"/>
    <rect x="88" y="68" width="9" height="26" rx="4.5"/>
    <rect x="100" y="68" width="9" height="26" rx="4.5"/>
    <rect x="112" y="70" width="9" height="24" rx="4.5"/>
    <!-- fingers -->
    <rect x="76" y="50" width="9" height="17" rx="4.5"/>
    <rect x="76" y="36" width="9" height="12" rx="4.5"/>
    <rect x="88" y="46" width="9" height="19" rx="4.5"/>
    <rect x="88" y="29" width="9" height="15" rx="4.5"/>
    <rect x="100" y="46" width="9" height="19" rx="4.5"/>
    <rect x="100" y="29" width="9" height="15" rx="4.5"/>
    <rect x="112" y="50" width="9" height="17" rx="4.5"/>
    <rect x="112" y="37" width="9" height="11" rx="4.5"/>
    <!-- thumb -->
    <rect x="124" y="78" width="9" height="18" rx="4.5" transform="rotate(-38 128 87)"/>
    <rect x="132" y="64" width="9" height="14" rx="4.5" transform="rotate(-38 136 71)"/>
    <!-- wrist -->
    <ellipse cx="98" cy="104" rx="22" ry="9"/>
    <rect x="86" y="108" width="11" height="12" rx="4"/>
    <rect x="101" y="108" width="11" height="12" rx="4"/>
  </g>
  <!-- tiny heart sticker on the film -->
  <path transform="translate(136 36)" d="M0 6 C-10 -2 -6 -10 0 -4 C6 -10 10 -2 0 6Z" fill="#F4A6C3" stroke="#D07798" stroke-width="2"/>
  <path d="M28 30 L44 28" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Clips -->
  <g fill="#B9C6CC" stroke="#8C9BA4" stroke-width="3">
    <rect x="58" y="12" width="20" height="10" rx="4"/>
    <rect x="122" y="12" width="20" height="10" rx="4"/>
  </g>
  <!-- Bottom rail with switch (on) -->
  <rect x="10" y="128" width="180" height="30" rx="12" fill="#CFEDE7" stroke="#8CC4B8" stroke-width="4"/>
  <rect x="146" y="134" width="28" height="18" rx="9" fill="#3EB59B" stroke="#2A8A74" stroke-width="3"/>
  <circle cx="165" cy="143" r="6" fill="#FFFFFF" stroke="#2A8A74" stroke-width="2.5"/>
  <path d="M26 143 H110" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".8"/>
</svg>
