<svg xmlns="http://www.w3.org/2000/svg" width="110" height="90" viewBox="0 0 110 90">
  <!-- Legs (back pair darker) -->
  <g stroke="#D0688E" stroke-width="4" stroke-linejoin="round">
    <rect x="20" y="66" width="14" height="22" rx="5" fill="#EC8FB2"/>
    <rect x="64" y="66" width="14" height="22" rx="5" fill="#EC8FB2"/>
    <rect x="34" y="68" width="14" height="20" rx="5" fill="#F7A8C4"/>
    <rect x="78" y="68" width="14" height="20" rx="5" fill="#F7A8C4"/>
  </g>
  <!-- Curly tail -->
  <path d="M11 46 Q3 46 4 39 Q6 33 11 37 Q13 42 6 43" fill="none" stroke="#D0688E" stroke-width="3.5" stroke-linecap="round"/>
