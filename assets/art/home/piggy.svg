  <!-- Face -->
  <ellipse cx="95" cy="50" rx="9" ry="12" fill="#F7A8C4" stroke="#D0688E" stroke-width="4"/>
  <g fill="#C2557E"><ellipse cx="93" cy="46" rx="2" ry="3"/><ellipse cx="93" cy="55" rx="2" ry="3"/></g>
  <circle cx="76" cy="40" r="3.5" fill="#3B2F2F"/>
  <circle cx="76" cy="56" r="5" fill="#F590B6"/>
  <path d="M22 36 Q28 28 38 26" fill="none" stroke="#FCD3E2" stroke-width="5" stroke-linecap="round"/>
</svg>
