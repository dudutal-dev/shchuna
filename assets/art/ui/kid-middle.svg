    <rect x="80" y="170" width="16" height="50" rx="7" fill="#3E7CB1"/>
    <rect x="104" y="170" width="16" height="50" rx="7" fill="#3E7CB1"/>
  </g>
  <g stroke="#C78F1E" stroke-width="3" stroke-linejoin="round">
    <ellipse cx="86" cy="225" rx="14" ry="7" fill="#FFC23C"/>
    <ellipse cx="114" cy="225" rx="14" ry="7" fill="#FFC23C"/>
  </g>
  <!-- Far arm -->
  <rect x="58" y="118" width="14" height="46" rx="7" transform="rotate(12 65 118)" fill="#E0A878" stroke="#B57F52" stroke-width="3"/>
  <!-- Shirt -->
  <path d="M70 120 Q70 106 100 106 Q130 106 130 120 L132 178 Q100 186 68 178Z" fill="#E5508A" stroke="#B73A6B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M72 140 H128" stroke="#FFFFFF" stroke-width="6" opacity=".6"/>
