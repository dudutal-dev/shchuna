  <path d="M126 152 Q146 164 166 150M134 176 Q150 160 150 139" fill="none" stroke="#3E8E7E" stroke-width="3" stroke-linecap="round"/>
  <rect x="124" y="118" width="14" height="44" rx="7" transform="rotate(-24 131 118)" fill="#E0A878" stroke="#B57F52" stroke-width="3"/>
  <!-- Head -->
  <circle cx="100" cy="70" r="36" fill="#E0A878" stroke="#B57F52" stroke-width="3"/>
  <path d="M64 70 Q62 30 100 30 Q138 30 136 70 Q130 52 112 50 Q92 44 78 54 Q68 58 64 70Z" fill="#3B2F2F" stroke="#241C1C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="87" cy="72" r="4.5" fill="#3B2F2F"/>
  <circle cx="113" cy="72" r="4.5" fill="#3B2F2F"/>
  <ellipse cx="77" cy="84" rx="7" ry="5" fill="#E5508A" opacity=".35"/>
  <ellipse cx="123" cy="84" rx="7" ry="5" fill="#E5508A" opacity=".35"/>
