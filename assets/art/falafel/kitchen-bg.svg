    <path d="M348 50 q-14 6 -10 22 q6 -10 10 -8Z"/><path d="M348 80 q14 6 10 22 q-6 -10 -10 -8Z"/><path d="M348 110 q-14 6 -10 22 q6 -10 10 -8Z"/>
    <path d="M752 50 q14 6 10 22 q-6 -10 -10 -8Z"/><path d="M752 80 q-14 6 -10 22 q6 -10 10 -8Z"/><path d="M752 110 q14 6 10 22 q-6 -10 -10 -8Z"/>
